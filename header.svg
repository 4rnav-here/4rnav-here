<svg viewBox="0 0 860 238" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; font-size: 14px; }
      @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
      @keyframes blink  { 0%,100% { opacity:1; } 50% { opacity:0; } }
      .l1 { opacity:0; animation: fadeIn .15s ease forwards .4s;  }
      .l2 { opacity:0; animation: fadeIn .15s ease forwards 1.2s; }
      .l3 { opacity:0; animation: fadeIn .15s ease forwards 2.0s; }
      .l4 { opacity:0; animation: fadeIn .15s ease forwards 2.8s; }
      .l5 { opacity:0; animation: fadeIn .15s ease forwards 3.6s; }
      .l6 { opacity:0; animation: fadeIn .15s ease forwards 4.4s; }
      .l7 { opacity:0; animation: fadeIn .15s ease forwards 5.0s; }
      .cur { opacity:0; animation: blink 1s step-end infinite 5.3s; }
    </style>
    <!-- Scanline subtle texture overlay -->
    <pattern id="scan" x="0" y="0" width="860" height="4" patternUnits="userSpaceOnUse">
      <rect width="860" height="1" y="3" fill="#ffffff" opacity="0.012"/>
    </pattern>
  </defs>

  <!-- Outer bg -->
  <rect width="860" height="238" fill="#0c0c18"/>

  <!-- Terminal card -->
  <rect x="18" y="10" width="824" height="218" rx="12" fill="#11111d" stroke="#28284a" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="18" y="10" width="824" height="36" rx="12" fill="#18182c"/>
  <rect x="18" y="33" width="824" height="13" fill="#18182c"/>

  <!-- Traffic lights -->
  <circle cx="49"  cy="28" r="7.5" fill="#ff5f57"/>
  <circle cx="73"  cy="28" r="7.5" fill="#febc2e"/>
  <circle cx="97"  cy="28" r="7.5" fill="#28c840"/>

  <!-- Tab label -->
  <rect x="160" y="14" width="160" height="28" rx="4" fill="#11111d"/>
  <text x="240" y="33" text-anchor="middle" font-family="monospace" font-size="12" fill="#6b6b8e">bash — arnav@dev</text>

  <!-- Window title right -->
  <text x="830" y="33" text-anchor="end" font-family="monospace" font-size="11" fill="#32324e">80×24</text>

  <!-- Scanline effect -->
  <rect width="860" height="238" fill="url(#scan)"/>

  <!-- ── LINE 1 ── prompt -->
  <text class="mono l1" x="42" y="72">
    <tspan fill="#a78bfa" font-weight="bold">arnav@dev</tspan><tspan fill="#5a5a7a">:</tspan><tspan fill="#34d399">~</tspan><tspan fill="#e2e8f0"> $ </tspan><tspan fill="#f8fafc">whoami</tspan>
  </text>

  <!-- ── LINE 2 ── whoami output -->
  <text class="mono l2" x="42" y="94">
    <tspan fill="#3d3d5e">  ❯  </tspan><tspan fill="#cbd5e1">Full Stack Developer</tspan><tspan fill="#4a4a6e">  ·  </tspan><tspan fill="#94a3b8">B.Tech CS Graduate</tspan><tspan fill="#4a4a6e">  ·  </tspan><tspan fill="#94a3b8">India 🇮🇳</tspan>
  </text>

  <!-- ── LINE 3 ── prompt -->
  <text class="mono l3" x="42" y="120">
    <tspan fill="#a78bfa" font-weight="bold">arnav@dev</tspan><tspan fill="#5a5a7a">:</tspan><tspan fill="#34d399">~</tspan><tspan fill="#e2e8f0"> $ </tspan><tspan fill="#f8fafc">cat stack.txt</tspan>
  </text>

  <!-- ── LINE 4 ── stack output -->
  <text class="mono l4" x="42" y="142">
    <tspan fill="#3d3d5e">  ❯  </tspan><tspan fill="#7c3aed">TS</tspan><tspan fill="#4a4a6e"> · </tspan><tspan fill="#339933">Node</tspan><tspan fill="#4a4a6e"> · </tspan><tspan fill="#61DAFB">React</tspan><tspan fill="#4a4a6e"> · </tspan><tspan fill="#3776AB">Python</tspan><tspan fill="#4a4a6e"> · </tspan><tspan fill="#4169E1">Postgres</tspan><tspan fill="#4a4a6e"> · </tspan><tspan fill="#DC382D">Redis</tspan><tspan fill="#4a4a6e"> · </tspan><tspan fill="#2496ED">Docker</tspan><tspan fill="#4a4a6e"> · </tspan><tspan fill="#FF9900">AWS</tspan>
  </text>

  <!-- ── LINE 5 ── prompt -->
  <text class="mono l5" x="42" y="168">
    <tspan fill="#a78bfa" font-weight="bold">arnav@dev</tspan><tspan fill="#5a5a7a">:</tspan><tspan fill="#34d399">~</tspan><tspan fill="#e2e8f0"> $ </tspan><tspan fill="#f8fafc">git log --oneline -1</tspan>
  </text>

  <!-- ── LINE 6 ── git output -->
  <text class="mono l6" x="42" y="190">
    <tspan fill="#3d3d5e">  ❯  </tspan><tspan fill="#f472b6">a7f3c2e</tspan><tspan fill="#94a3b8">  always shipping · open to work · let's build something 🚀</tspan>
  </text>

  <!-- ── LINE 7 ── idle prompt + cursor -->
  <text class="mono l7" x="42" y="216">
    <tspan fill="#a78bfa" font-weight="bold">arnav@dev</tspan><tspan fill="#5a5a7a">:</tspan><tspan fill="#34d399">~</tspan><tspan fill="#e2e8f0"> $ </tspan>
  </text>
  <rect class="cur" x="163" y="201" width="9" height="18" fill="#a78bfa"/>

</svg>
