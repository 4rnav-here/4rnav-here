<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Silkscreen:wght@700&amp;display=swap');
    </style>
    <!-- pixel grid pattern -->
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1a2a1a" stroke-width="0.6"/>
    </pattern>
    <!-- scanline pattern -->
    <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>

  <!-- bg -->
  <rect width="900" height="280" fill="#080c08"/>
  <!-- pixel grid overlay -->
  <rect width="900" height="280" fill="url(#grid)" opacity="0.7"/>
  <!-- scanlines -->
  <rect width="900" height="280" fill="url(#scan)" opacity="0.4"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="3" height="280" fill="#39ff6e"/>

  <!-- top status bar -->
  <rect x="0" y="0" width="900" height="32" fill="#0d130d"/>
  <rect x="0" y="32" width="900" height="1" fill="#1f2e1f"/>

  <!-- status dot (square pixel style) -->
  <rect x="16" y="12" width="8" height="8" fill="#39ff6e"/>
  <text x="32" y="22" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a6a4a" letter-spacing="2">arnav@dev:~$</text>
  <text x="900" y="22" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#2a3d2a" letter-spacing="2">v2.0.4 · india 🇮🇳</text>

  <!-- main name -->
  <!-- shadow layers for chunky pixel effect -->
  <text x="453" y="138" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="72" font-weight="700" fill="rgba(57,255,110,0.12)" letter-spacing="10">ARNAV</text>
  <text x="452" y="136" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="72" font-weight="700" fill="rgba(57,255,110,0.25)" letter-spacing="10">ARNAV</text>
  <text x="450" y="134" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="72" font-weight="700" fill="#39ff6e" letter-spacing="10">ARNAV</text>

  <!-- cursor block after name -->
  <rect x="729" y="102" width="14" height="52" fill="#39ff6e" opacity="0.9"/>

  <!-- tagline -->
  <text x="450" y="168" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#00e5cc" letter-spacing="1.5">full stack developer · scalable systems · AI-powered apps</text>

  <!-- XP bar area -->
  <rect x="150" y="196" width="600" height="1" fill="#1f2e1f"/>

  <!-- XP label -->
  <text x="150" y="216" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#2a4a2a" letter-spacing="3">EXP</text>
  <text x="750" y="216" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#2a4a2a" letter-spacing="2">72 / 100</text>

  <!-- XP track -->
  <rect x="150" y="222" width="600" height="8" fill="#0d130d" rx="0"/>
  <rect x="151" y="223" width="598" height="6" fill="#111811" rx="0"/>
  <!-- XP fill -->
  <rect x="151" y="223" width="430" height="6" fill="#39ff6e" rx="0"/>
  <!-- XP bright tip -->
  <rect x="580" y="223" width="2" height="6" fill="#9fffbc"/>

  <!-- bottom pixel blocks decoration -->
  <!-- left cluster -->
  <rect x="150" y="248" width="8" height="8" fill="#1a2a1a"/>
  <rect x="160" y="248" width="8" height="8" fill="#1f2e1f"/>
  <rect x="170" y="248" width="8" height="8" fill="#1a2a1a"/>
  <rect x="150" y="258" width="8" height="8" fill="#1f2e1f"/>
  <rect x="160" y="258" width="8" height="8" fill="#39ff6e" opacity="0.3"/>
  <rect x="170" y="258" width="8" height="8" fill="#1f2e1f"/>
  <!-- right cluster -->
  <rect x="722" y="248" width="8" height="8" fill="#1a2a1a"/>
  <rect x="732" y="248" width="8" height="8" fill="#1f2e1f"/>
  <rect x="742" y="248" width="8" height="8" fill="#1a2a1a"/>
  <rect x="722" y="258" width="8" height="8" fill="#1f2e1f"/>
  <rect x="732" y="258" width="8" height="8" fill="#00e5cc" opacity="0.3"/>
  <rect x="742" y="258" width="8" height="8" fill="#1f2e1f"/>

  <!-- bottom border -->
  <rect x="0" y="278" width="900" height="2" fill="#1f2e1f"/>
</svg>
