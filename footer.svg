<svg width="900" height="60" viewBox="0 0 900 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid2" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1a2a1a" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="900" height="60" fill="#080c08"/>
  <rect width="900" height="60" fill="url(#grid2)" opacity="0.7"/>
  <rect x="0" y="0" width="3" height="60" fill="#39ff6e"/>
  <rect x="0" y="0" width="900" height="1" fill="#1f2e1f"/>

  <!-- quote -->
  <text x="450" y="26" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#2a4a2a" letter-spacing="0.5">// if my code works, don't touch it.</text>
  <text x="450" y="44" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#2a4a2a" letter-spacing="0.5">// if it doesn't — also don't touch it.</text>
  <rect x="0" y="58" width="900" height="2" fill="#1f2e1f"/>
</svg>
